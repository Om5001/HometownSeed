name: Refresh Census data
on:
  schedule:
    - cron: "17 9 1 * *"   # monthly (ACS 5-year releases each December; upserts are idempotent)
  workflow_dispatch:
    inputs:
      year:
        description: "ACS 5-year release year"
        required: false
        default: "2024"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Pull ACS + Gazetteer into Postgres
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: zipgive refresh --year "${{ github.event.inputs.year || vars.ACS_YEAR || '2024' }}"
