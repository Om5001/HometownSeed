[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zipgive-data"
version = "0.1.0"
description = "Data pipeline: ZIP-level child population estimates for Trump Account general contributions"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zipgive = "zipgive_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
